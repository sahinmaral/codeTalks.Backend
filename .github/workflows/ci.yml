name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore codeTalks.Backend.sln

      - name: Build
        run: dotnet build codeTalks.Backend.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/codeTalks.Application.UnitTests --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests
        run: dotnet test tests/codeTalks.WebAPI.IntegrationTests --no-build --configuration Release --logger "console;verbosity=normal"

  push-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/mainPackages/codeTalks.WebAPI/Dockerfile
          push: true
          tags: |
            ghcr.io/sahinmaral/codetalks-backend:latest
            ghcr.io/sahinmaral/codetalks-backend:${{ github.sha }}